# DEMONSTRATION DEFAULTS, not scientifically justified experimental budgets.
schema_version = 1

[run]
max_epochs = 4
min_attempts = 2
plateau_patience = 2
failure_limit = 2
max_tool_calls = 12

# Per lineage, across all iterations. Monetary units are millionths of USD.
[total]
model_calls = 40
input_tokens = 0
output_tokens = 0
cost_microusd = 0
compute_seconds = 600
edit_bytes = 20000
edit_operations = 20

# Reserved before each attempt; unused portion returned after checkpoint.
[attempt]
model_calls = 4
input_tokens = 0
output_tokens = 0
cost_microusd = 0
compute_seconds = 90
edit_bytes = 4000
edit_operations = 4

[runtime]
engine = "trusted-local" # or "docker" with an immutable image below
image = "" # e.g. python@sha256:<digest>; image must already be downloaded
cpus = 1.0
memory_mb = 128
pids = 32
timeout_seconds = 5.0
tmpfs_mb = 16
max_output_bytes = 4096

[workspace]
max_file_bytes = 256000
max_workspace_bytes = 2000000

[information]
max_prompt_chars = 30000
max_history_items = 3
max_metric_items = 10
max_workspace_files = 10
max_workspace_bytes = 100000

[task]
id = "integer-sum"
minimum_improvement = 0.0 # strict improvement greater than this amount
development_cases = [[], [1, 2, 3], [-2, 1]]
selection_cases = [[0], [4, 5], [-1], [3, -7, 2], [-4, -5], [1000, -1000, 7]]

[[lineages]]
id = "lineage-a"
origin = "loop"
model = "scripted-v1"

[[lineages]]
id = "lineage-b"
origin = "recursive"
model = "scripted-v1"

[[lineages]]
id = "lineage-c"
origin = "reduce"
model = "scripted-v1"
