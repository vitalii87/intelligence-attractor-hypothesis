# TEMPLATE: set model IDs and verified rates before use; see OPENAI.md.
# DEMONSTRATION DEFAULTS, not scientifically justified experimental budgets.
schema_version = 1

[run]
max_epochs = 4
min_attempts = 2
plateau_patience = 2
failure_limit = 2
max_tool_calls = 12

# Per lineage, across all iterations. Monetary units are millionths of USD.
[total]
model_calls = 40
input_tokens = 960000
output_tokens = 128000
cost_microusd = 1000000
compute_seconds = 600
edit_bytes = 20000
edit_operations = 20

# Reserved before each attempt; unused portion returned after checkpoint.
[attempt]
model_calls = 8
input_tokens = 240000
output_tokens = 32000
cost_microusd = 250000
compute_seconds = 90
edit_bytes = 4000
edit_operations = 4

[runtime]
engine = "docker" # required for real agents
image = "python@sha256:da047cb8f9d1d98e5c070f5300ba9f7274e33b8fc0e5be5ed88740aed1b95ba9" # e.g. python@sha256:<digest>; image must already be downloaded
cpus = 1.0
memory_mb = 128
pids = 32
timeout_seconds = 5.0
tmpfs_mb = 16
max_output_bytes = 4096

[workspace]
max_file_bytes = 256000
max_workspace_bytes = 2000000

[information]
max_prompt_chars = 30000
max_history_items = 3
max_metric_items = 10
max_workspace_files = 10
max_workspace_bytes = 100000

[task]
id = "integer-sum"
minimum_improvement = 0.0 # strict improvement greater than this amount
development_cases = [[], [1, 2, 3], [-2, 1]]
selection_cases = [[0], [4, 5], [-1], [3, -7, 2], [-4, -5], [1000, -1000, 7]]

[[lineages]]
id = "lineage-a"
origin = "loop"
model = "openai/"

[[lineages]]
id = "lineage-b"
origin = "recursive"
model = "openai/"

[[lineages]]
id = "lineage-c"
origin = "reduce"
model = "openai/"

[openai]
key_env = "OPENAI_API_KEY"
timeout_seconds = 120
max_input_tokens = 30000
max_output_tokens = 4000
# Required: current micro-USD per million tokens; zero prevents accidental launch.
input_microusd_per_million = 0
output_microusd_per_million = 0
